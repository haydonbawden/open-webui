name: Build Windows executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install --force --no-audit
        shell: pwsh

      - name: Build frontend
        env:
          APP_BUILD_HASH: ${{ github.sha }}
        run: npm run build
        shell: pwsh

      - name: Copy frontend build into Python package
        shell: pwsh
        run: |
          if (Test-Path "backend\open_webui\frontend") { Remove-Item "backend\open_webui\frontend" -Recurse -Force }
          New-Item -ItemType Directory -Path "backend\open_webui\frontend" | Out-Null
          Copy-Item -Recurse -Force "build\*" "backend\open_webui\frontend\"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-windows.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: python scripts/build_windows_exe.py
        shell: pwsh

      - name: Rename executable with version
        id: rename
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $asset = "open-webui-$version-windows-x64.exe"
          Rename-Item "dist/Open-WebUI.exe" $asset
          "asset_name=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.rename.outputs.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
